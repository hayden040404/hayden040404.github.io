<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Back Alley has moved</title>
  <!-- Fallback if JavaScript is off: plain redirect (keeps the main page). -->
  <meta http-equiv="refresh" content="4; url=https://back-alley-play.web.app/">
  <style>
    html, body { margin: 0; height: 100%; background: #0B1B33; color: #F4EFE6; font: 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100%; display: grid; place-items: center; text-align: center; padding: 24px; box-sizing: border-box; }
    a { color: #E0B85C; }
    p { color: #9aa3b5; }
  </style>
</head>
<body>
  <main>
    <div>
      <h1 style="font-size:22px;margin:0 0 8px">Back Alley has moved</h1>
      <p>Taking you to <a id="go" href="https://back-alley-play.web.app/">back-alley-play.web.app</a>&hellip;</p>
    </div>
  </main>
  <script>
  /* Old address: forward to the new one, keeping path, query and hash. The first time, also
   * carry this phone's saved games over (packed into the URL hash, which never leaves the phone;
   * the new site's handoff.js unpacks and merges them). Also removes this site's offline caches
   * and service workers so installed copies stop serving the old app. */
  (function () {
    'use strict';
    var NEW_ORIGIN = 'https://back-alley-play.web.app';
    var MAX = 1800000;
    var target = NEW_ORIGIN + location.pathname + location.search;
    document.getElementById('go').href = target + location.hash;

    function cleanup() {
      var jobs = [];
      try { if ('serviceWorker' in navigator) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); })); } catch (e) {}
      try { if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); })); } catch (e) {}
      return Promise.race([Promise.all(jobs).catch(function () {}), new Promise(function (r) { setTimeout(r, 1200); })]);
    }
    function bytesToB64url(bytes) {
      var bin = '';
      for (var i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }
    function encode(text) {
      var raw = new TextEncoder().encode(text);
      if (typeof CompressionStream === 'undefined') return Promise.resolve('j' + bytesToB64url(raw));
      var cs = new CompressionStream('gzip');
      return new Response(new Blob([raw]).stream().pipeThrough(cs)).arrayBuffer().then(function (buf) { return 'z' + bytesToB64url(new Uint8Array(buf)); });
    }
    function collect(dropFinishedStates) {
      var data = {};
      var n = 0;
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (!k || k.indexOf('backalley-') !== 0 || k === 'backalley-play-account' || k === 'backalley-handoff-sent') continue;
        var v = localStorage.getItem(k);
        try { v = JSON.parse(v); } catch (e) {}
        if (dropFinishedStates && k === 'backalley-play-games-v1' && v && v.games) v.games = v.games.filter(function (g) { return !g.finished; });
        data[k] = v; n++;
      }
      return n ? JSON.stringify({ v: 1, hash: location.hash || '', data: data }) : null;
    }
    function go(url) { location.replace(url); }

    var sent = false;
    try { sent = !!localStorage.getItem('backalley-handoff-sent'); } catch (e) {}
    var payload = null;
    try { if (!sent) payload = collect(false); } catch (e) {}

    cleanup().then(function () {
      if (!payload) return go(target + location.hash);
      return encode(payload).then(function (enc) {
        if (enc.length > MAX) {
          var smaller = collect(true);
          return smaller ? encode(smaller) : null;
        }
        return enc;
      }).then(function (enc) {
        if (!enc || enc.length > MAX) return go(target + location.hash);
        try { localStorage.setItem('backalley-handoff-sent', String(Date.now())); } catch (e) {}
        go(target + '#ba-handoff=' + enc);
      });
    }).catch(function () { go(target + location.hash); });
  })();
  </script>
</body>
</html>
