  <style>
    :root {
      --bg: #070b14;
      --navy: #0B1B33;
      --surface: #121c2e;
      --elevated: #1a2740;
      --elevated-2: #22304c;
      --line: rgba(244, 239, 230, 0.10);
      --text: #f4efe6;
      --muted: #9aa3b5;
      --gold: #e0b85c;
      --gold-dim: rgba(224, 184, 92, 0.16);
      --red: #f45b69;
      --green: #3ecf8e;
      --heart: #ff5a67;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bot: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --radius: 16px;
      --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100%;
      min-height: 100dvh;
      overscroll-behavior: none;
    }
    body { padding: 0; }
    button {
      font: inherit;
      color: inherit;
      background: none;
      border: 0;
      padding: 0;
      cursor: pointer;
    }
    input {
      font: inherit;
      font-size: 16px;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      width: 100%;
      outline: none;
    }
    input:focus { border-color: var(--gold); }
    h1, h2, h3, p { margin: 0; }
    .app { min-height: 100dvh; }
    .chrome {
      position: sticky;
      top: 0;
      z-index: 20;

</head>
<body>
  <div id="app"></div>
  <script src="score.js"></script>
  <script>
  (function () {
    'use strict';
    var BA = window.BackAlley;
    var KEYS = {
      current: 'backalley-current-v1',
      past: 'backalley-past-v1',
      prefs: 'backalley-prefs-v1'
    };
    var SUITS = {
      spades:   { glyph: '\u2660', label: 'Spades',   color: 'black' },
      hearts:   { glyph: '\u2665', label: 'Hearts',   color: 'red' },
      diamonds: { glyph: '\u2666', label: 'Diamonds', color: 'red' },
      clubs:    { glyph: '\u2663', label: 'Clubs',    color: 'black' }
    };
    var SUIT_ORDER = ['spades', 'hearts', 'diamonds', 'clubs'];

    var state = {
      game: null,
      past: [],
      prefs: { tipDismissed: false },
      undoStack: [],
      editingIndex: null,
      sheet: null,
      toast: null
    };

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }
    function esc(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }
    function loadJson(key, fallback) {
      try {
        var raw = localStorage.getItem(key);
        if (!raw) return fallback;
        return JSON.parse(raw);
      } catch (e) {
        return fallback;
      }
    }
    function saveJson(key, value) {
      try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {}
    }
    function createGame(preset) {
      preset = preset || {};
      var maxCards = BA.clampMaxCards(preset.maxCards);
      var hands = BA.createHands(maxCards).map(function (h) {
        h.recorded = false;
        return h;
      });
      return {
        id: uid(),
        startedAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        teamA: {
          name: preset.teamA || 'Team A',
          p1: preset.a1 || '',
          p2: preset.a2 || ''
        },
        teamB: {
          name: preset.teamB || 'Team B',
          p1: preset.b1 || '',
          p2: preset.b2 || ''
        },
        firstDealer: typeof preset.firstDealer === 'number' ? preset.firstDealer : 0,
        maxCards: maxCards,
        hands: hands,
        archived: false
      };
    }
    function persist() {
      if (!state.game) return;
      state.game.updatedAt = new Date().toISOString();
      saveJson(KEYS.current, state.game);
      saveJson(KEYS.prefs, {
        tipDismissed: state.prefs.tipDismissed,
        teamA: state.game.teamA,
        teamB: state.game.teamB,
        firstDealer: state.game.firstDealer,
        lastMaxCards: state.game.maxCards
      });
    }
    function savePast() { saveJson(KEYS.past, state.past); }
    function snapshotGame() { return JSON.parse(JSON.stringify(state.game)); }
    function pushUndo() {
      state.undoStack.push(snapshotGame());
      if (state.undoStack.length > 50) state.undoStack.shift();
    }
    function undo() {
      if (!state.undoStack.length) return;
      state.game = state.undoStack.pop();
      state.editingIndex = null;
      persist();
      render();
    }
    function scored() {
      var hands = state.game.hands.map(function (h) {
        return h.recorded ? h : Object.assign({}, h, { aBid: null, aTook: null, bBid: null, bTook: null });
      });
      return BA.scoreGame(hands);
    }
    function recordedCount() {
      return state.game.hands.filter(function (h) { return h.recorded; }).length;
    }
    function firstOpenIndex() {
      for (var i = 0; i < state.game.hands.length; i++) {
        if (!state.game.hands[i].recorded) return i;
      }
      return -1;
    }
    function activeIndex() {
      if (state.editingIndex !== null) return state.editingIndex;
      return firstOpenIndex();
    }
    function seats(game) {
      var a = game.teamA, b = game.teamB;
      function nm(raw, teamName, slot) {
        var t = (raw || '').trim();
        return t || (teamName + ' \u00b7 P' + slot);
      }
      return [
        { team: 'A', name: nm(a.p1, a.name, 1) },
        { team: 'B', name: nm(b.p1, b.name, 1) },
        { team: 'A', name: nm(a.p2, a.name, 2) },
        { team: 'B', name: nm(b.p2, b.name, 2) }
      ];
    }
    function dealerFor(index) {
      var s = seats(state.game);
      var i = ((state.game.firstDealer || 0) + index) % 4;
      if (i < 0) i += 4;
      return { current: s[i], next: s[(i + 1) % 4], seat: i };
    }
    function clamp(n, min, max) {
      return Math.max(min, Math.min(max, n));
    }
    function fmtPts(n, withSign) {
      if (n === null || n === undefined) return '\u2014';
      if (withSign && n > 0) return '+' + n;
      return String(n);
    }
    function fmtDate(iso) {
      try {
        return new Date(iso).toLocaleString(undefined, {
          month: 'short', day: 'numeric', year: 'numeric',
          hour: 'numeric', minute: '2-digit'
        });
      } catch (e) { return iso; }
    }
    function isStandalone() {
      return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
    }
    function buzz() {
      try { if (navigator.vibrate) navigator.vibrate(8); } catch (e) {}
    }
    function bagTicks(n) {
      var html = '<div class="bags-bar" aria-hidden="true">';
      for (var i = 0; i < 10; i++) html += '<span class="' + (i < n ? 'on' : '') + '"></span>';
      return html + '</div>';
    }
    function suitGlyph(suit) {
      if (!suit || !SUITS[suit]) return '\u2014';
      var s = SUITS[suit];
      return '<span class="suitg ' + s.color + '">' + s.glyph + '</span>';
    }

    function setVal(index, side, field, value) {
      pushUndo();
      var hand = state.game.hands[index];
      var cards = hand.cards;
      var key = side + field;
      if (value === null || value === '') {
        hand[key] = null;
      } else {
        var v = clamp(Number(value), 0, cards);
        if (!isFinite(v)) v = 0;
        if (field === 'Bid' && hand[side + 'Boston'] && cards >= 6) v = Math.max(6, v);
        var rbMin = BA.rainbowFor(cards);
        if (field === 'Bid' && hand[side + 'Rainbow'] && rbMin) v = Math.max(rbMin.need, v);
        hand[key] = v;
        if (field === 'Bid' && hand[side + 'Board'] && v !== cards) {
          hand[side + 'Board'] = 0;
        }
        if (field === 'Took') {
          var other = side === 'a' ? 'b' : 'a';
          hand[other + 'Took'] = cards - v;
        }
      }
      persist();
      render();
    }
    function stepVal(index, side, field, delta) {
      var hand = state.game.hands[index];
      var cur = hand[side + field];

          '<li><b>Boston</b> (hands of 6 or more cards) is a bid of <b>6 or more</b>. You must take the <b>first 6</b> tricks and at least as many as you bid. Make it: +120 for the first 6, +10 for each trick bid over 6, and +1 for every trick over the bid (a bag). Miss the first 6, or take fewer than you bid: \u221220 per trick bid. Tricks over the bid are still sandbags (they count toward the 10-bag \u2212100 penalty; only a made Boston gets the +1 bag points).</li>' +
          '<li><b>\ud83c\udf08 Rainbow</b> (4-card hands only): you\u2019re dealt <b>one of each suit</b> (a joker counts as that hand\u2019s trump suit). Your team must bid <b>at least 1</b> (you can bid more). Make your bid: <b>+20</b> for the first trick and <b>+10</b> for each trick after that. Get set: minus what the bid was worth \u2014 \u221220 for a bid of 1, \u221210 more for each trick bid over 1. No bags either way.</li>' +
          '<li><b>\ud83c\udf08 Double Rainbow</b> (8-card hands only): you\u2019re dealt <b>exactly two of each suit</b> (a joker counts as that hand\u2019s trump suit). Your team must bid <b>at least 2</b> (you can bid more). Make your bid: <b>+40</b> for the first two tricks (20 each) and <b>+10</b> for each trick after that. Get set: minus what the bid was worth \u2014 \u221240 for a bid of 2, \u221210 more for each trick bid over 2. No bags either way.</li>' +
          '<li>Every time a team\u2019s bags reach 10: <b>\u2212100</b> and the bag count drops by 10.</li>' +
          '<li>After the last hand, the team with the most points wins.</li>' +
          '</ul><button class="primary" type="button" data-act="close-sheet">Got it</button>';
      } else if (sh.type === 'past') {
        inner = '<h2>Past games</h2>';
        if (!state.past.length) inner += '<div class="empty">No past games yet. Finish or start a new game and the current one will be saved here.</div>';
        else {
          var list = state.past.slice().sort(function (a, b) {
            if (!!a.complete === !!b.complete) return 0;
            return a.complete ? 1 : -1;
          });
          list.forEach(function (p) {
            inner += '<div class="past-row">';
            inner += '<button class="past-item" type="button" data-act="view-past" data-id="' + esc(p.id) + '">';
            inner += '<div class="when">' + esc(fmtDate(p.endedAt || p.startedAt)) + (p.complete ? '' : ' \u00b7 in progress') + '</div>';
            inner += '<div class="line"><span>' + esc(p.teamA.name) + '</span><b>' + p.aTotal + '</b></div>';
            inner += '<div class="line"><span>' + esc(p.teamB.name) + '</span><b>' + p.bTotal + '</b></div>';
            inner += '<div class="won">' + esc(winnerLabel(p.winner, p)) + '</div></button>';
            inner += '<button class="trash-btn" type="button" data-act="ask-delete" data-id="' + esc(p.id) + '" aria-label="Delete this game">';
            inner += '<svg viewBox="0 0 24 24" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>';
            inner += '</button></div>';
          });
        }
        inner += '<button class="secondary" type="button" data-act="close-sheet">Close</button>';
      } else if (sh.type === 'pastView') {
        var p = state.past.find(function (x) { return x.id === sh.id; });
        if (!p) inner = '<h2>Game</h2><p>Couldn\u2019t find that game.</p>';
        else {
          inner = '<h2>' + esc(winnerLabel(p.winner, p)) + '</h2>';
          inner += '<p style="margin-bottom:12px;color:var(--muted)">' + esc(fmtDate(p.endedAt || p.startedAt)) + '</p>';
          inner += '<p style="margin-bottom:4px;"><b>' + esc(p.teamA.name) + '</b> ' + p.aTotal + ' \u00b7 ' + p.aBags + '/10 bags</p>';
          inner += '<p style="margin-bottom:14px;"><b>' + esc(p.teamB.name) + '</b> ' + p.bTotal + ' \u00b7 ' + p.bBags + '/10 bags</p>';
          inner += '<button class="primary" type="button" data-act="reopen" data-id="' + esc(p.id) + '">Reopen this game</button>';
          inner += '<button class="danger" type="button" data-act="ask-delete" data-id="' + esc(p.id) + '">Delete this game</button>';
          inner += '<button class="secondary" type="button" data-act="open-past">Back to list</button>';
        }
      } else if (sh.type === 'confirm') {
        inner = '<h2>' + esc(sh.title) + '</h2><p style="margin-bottom:12px;color:var(--muted)">' + esc(sh.message) + '</p>';
        inner += '<button class="danger" type="button" data-act="' + esc(sh.action) + '"' + (sh.deleteId ? ' data-id="' + esc(sh.deleteId) + '"' : '') + '>' + esc(sh.confirm) + '</button>';
        inner += '<button class="secondary" type="button" data-act="close-sheet">Cancel</button>';
      } else if (sh.type === 'pad') {
        var hand = state.game.hands[sh.index];
        var team = sh.side === 'a' ? state.game.teamA : state.game.teamB;
        var fieldLabel = sh.field === 'Bid' ? 'bid' : 'tricks taken';
        var cur = hand[sh.side + sh.field];
        inner = '<h2>' + esc(team.name) + ' ' + fieldLabel + '</h2>';
        inner += '<p style="margin-bottom:12px;color:var(--muted)">' + hand.cards + '-card hand' + (sh.field === 'Bid' && hand[sh.side + 'Boston'] ? ' \u00b7 Boston bid is 6 or more' : '') + (sh.field === 'Bid' && hand[sh.side + 'Rainbow'] && BA.rainbowFor(hand.cards) ? ' \u00b7 ' + BA.rainbowFor(hand.cards).short + ' bid is ' + BA.rainbowFor(hand.cards).need + ' or more' : '') + '</p>';
        inner += '<div class="pad-grid">';
        var padMin = (sh.field === 'Bid' && hand[sh.side + 'Boston'] && hand.cards >= 6) ? 6 : 0;
        if (sh.field === 'Bid' && hand[sh.side + 'Rainbow'] && BA.rainbowFor(hand.cards)) padMin = BA.rainbowFor(hand.cards).need;
        for (var n = padMin; n <= hand.cards; n++) {
          inner += '<button type="button" class="' + (cur === n ? 'on' : '') + '" data-act="pad-set" data-value="' + n + '">' + n + '</button>';
        }
        inner += '</div><button class="secondary" type="button" data-act="close-sheet">Cancel</button>';
      } else if (sh.type === 'start-pad') {
        var startCur = BA.clampMaxCards(state.game.maxCards);
        inner = '<h2>Start at how many cards?</h2>';
        inner += '<p style="margin-bottom:12px;color:var(--muted)">' + esc(riverCaption(startCur)) + '</p>';
        inner += '<div class="pad-grid">';
        for (var n = 1; n <= 13; n++) {
          inner += '<button type="button" class="' + (startCur === n ? 'on' : '') + '" data-act="start-pad-set" data-value="' + n + '">' + n + '</button>';
        }
        inner += '</div><button class="secondary" type="button" data-act="close-sheet">Cancel</button>';
      }
      return '<div class="backdrop" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>' + inner + '</div>';
    }

    function render() {
      var g = state.game;
      var score = scored();
      var current = activeIndex();
      var played = recordedCount();
      var tied = score.leader === 'tie' && played > 0;
      var root = document.getElementById('app');
      var html = '<div class="app"><header class="chrome"><div class="brand-row">';
      html += '<div class="brand"><div class="logo">BA</div><div><h1>Back Alley</h1><div class="sub">';
      html += played === 0 ? 'New game' : (played === g.hands.length ? 'Final' : 'Hand ' + Math.min(played + 1, g.hands.length) + ' of ' + g.hands.length);
      html += '</div></div></div><div class="top-actions">';
      html += '<button class="icon-btn" type="button" data-act="undo" ' + (state.undoStack.length ? '' : 'disabled ') + 'aria-label="Undo">';
      html += '<svg viewBox="0 0 24 24"><path d="M9 14l-4-4 4-4"/><path d="M5 10h8a6 6 0 1 1 0 12H9"/></svg></button>';
      html += '<button class="icon-btn" type="button" data-act="menu" aria-label="Menu">';
      html += '<svg viewBox="0 0 24 24"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>';
      html += '</div></div><div class="scores">';
      html += teamCard(g.teamA.name, score.aTotal, score.aBags, score.leader === 'A' && played > 0, tied);
      html += teamCard(g.teamB.name, score.bTotal, score.bBags, score.leader === 'B' && played > 0, tied);
      html += '</div></header><main>';

      if (!isStandalone() && !state.prefs.tipDismissed) {
        html += '<div class="tip"><div>On iPhone, open this page in <strong>Safari</strong>, tap the Share button, then <strong>Add to Home Screen</strong>. It opens like an app and works offline.</div>';
        html += '<button class="x" type="button" data-act="dismiss-tip" aria-label="Dismiss">\u00d7</button></div>';
      }
      if (played === g.hands.length && current === -1) {
        html += '<div class="banner win"><div class="who">Game over</div><h2>' + esc(winnerLabel(score.leader, g)) + '</h2>';
        html += '<div class="final">' + esc(g.teamA.name) + ' ' + score.aTotal + ' \u00b7 ' + esc(g.teamB.name) + ' ' + score.bTotal + '</div>';
        html += '<button class="primary" type="button" data-act="open-newgame">New game</button></div>';
      }
      if (played === 0) {
        var startN = BA.clampMaxCards(g.maxCards);
        html += '<section class="hand-card start-count"><div class="label">Start at how many cards?</div>';
        html += '<div class="stepper" style="max-width:220px;margin:0 auto 8px;">';
        html += '<button class="nudge" type="button" data-act="start-cards" data-delta="-1" aria-label="Fewer cards">\u2212</button>';
        html += '<button class="value" type="button" data-act="open-start-pad" aria-label="Starting card count">' + startN + '</button>';
        html += '<button class="nudge" type="button" data-act="start-cards" data-delta="1" aria-label="More cards">+</button>';
        html += '</div><p style="text-align:center;color:var(--muted);font-size:13px;line-height:1.4;margin:0;">' + esc(riverCaption(startN)) + '</p></section>';
      }
      if (current !== -1) html += renderHandEditor(current, score);
      html += renderHistory(score, current);
      html += '</main></div>';
      html += renderSheet();
      root.innerHTML = html;
    }

    function fieldPath(obj, path, value) {
      var parts = path.split('.');
      var cur = obj;
      for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
      cur[parts[parts.length - 1]] = value;
    }

    function onClick(e) {
      var t = e.target.closest('[data-act]');
      if (!t) return;
      var act = t.getAttribute('data-act');
      var index = t.getAttribute('data-index') != null ? Number(t.getAttribute('data-index')) : null;
      if (act === 'undo') undo();
      else if (act === 'menu') { state.sheet = { type: 'menu' }; render(); }
      else if (act === 'close-sheet') { state.sheet = null; persist(); render(); }
      else if (act === 'open-teams') { state.sheet = { type: 'teams' }; render(); }
      else if (act === 'open-rules') { state.sheet = { type: 'rules' }; render(); }
      else if (act === 'open-past') { state.sheet = { type: 'past' }; render(); }
      else if (act === 'view-past') { state.sheet = { type: 'pastView', id: t.getAttribute('data-id') }; render(); }
      else if (act === 'reopen') reopenPast(t.getAttribute('data-id'));
      else if (act === 'ask-delete') askDeleteGame(t.getAttribute('data-id'));
      else if (act === 'confirm-delete') deletePast(t.getAttribute('data-id') || (state.sheet && state.sheet.deleteId));
      else if (act === 'open-newgame') {
        var msg = recordedCount()
          ? 'The current game will be saved to Past Games, then a new scorecard will start with the same teams.'
          : 'This will clear the scorecard. No hands have been recorded yet.';
        state.sheet = { type: 'confirm', title: 'Start a new game?', message: msg, confirm: 'New game', action: 'confirm-newgame' };
        render();
      }
      else if (act === 'confirm-newgame') startNewGame();
      else if (act === 'start-cards') setMaxCards((state.game.maxCards || 13) + Number(t.getAttribute('data-delta')));
      else if (act === 'open-start-pad') { state.sheet = { type: 'start-pad' }; render(); }
      else if (act === 'start-pad-set') { state.sheet = null; setMaxCards(Number(t.getAttribute('data-value'))); }
      else if (act === 'dismiss-tip') { state.prefs.tipDismissed = true; persist(); render(); }
      else if (act === 'set-trump') { setTrump(index, t.getAttribute('data-suit')); }
      else if (act === 'set-board') { setBoard(index, t.getAttribute('data-side'), Number(t.getAttribute('data-mult'))); }
      else if (act === 'set-boston') { setBoston(index, t.getAttribute('data-side')); }
      else if (act === 'set-rainbow') { setRainbow(index, t.getAttribute('data-side')); }
      else if (act === 'set-boston-made') { setBostonMade(index, t.getAttribute('data-side'), t.getAttribute('data-value') === 'true'); }
      else if (act === 'step') {
        stepVal(index, t.getAttribute('data-side'), t.getAttribute('data-field'), Number(t.getAttribute('data-delta')));
      }
      else if (act === 'open-pad') {
        state.sheet = { type: 'pad', index: index, side: t.getAttribute('data-side'), field: t.getAttribute('data-field') };
        render();
      }
      else if (act === 'pad-set') {
        var sh = state.sheet;
        if (!sh || sh.type !== 'pad') return;
        setVal(sh.index, sh.side, sh.field, Number(t.getAttribute('data-value')));
        state.sheet = null;
        persist();
        render();
      }
      else if (act === 'record') recordHand(index);
      else if (act === 'done-edit') doneEditing();
      else if (act === 'edit-hand') {
        state.editingIndex = index;
        state.sheet = null;
        render();
        var card = document.querySelector('.hand-card');
        if (card) card.scrollIntoView({ block: 'start', behavior: 'smooth' });
      }
      else if (act === 'set-dealer') {
        pushUndo();
        state.game.firstDealer = Number(t.getAttribute('data-seat'));
        persist();
        render();
      }
    }
    function onInput(e) {
      var field = e.target.getAttribute('data-field');
      if (!field) return;
      fieldPath(state.game, field, e.target.value);
      persist();
    }

    function migrateHands(hands, maxCards) {
      var list = BA.handsCardsFor(maxCards);
      if (!Array.isArray(hands) || hands.length !== list.length) return BA.createHands(maxCards).map(function (h) { h.recorded = false; return h; });
      return hands.map(function (h, i) {
        return {
          cards: list[i],
          trump: SUITS[h.trump] ? h.trump : null,
          aBid: BA.isFilled(h.aBid) ? Number(h.aBid) : null,
          aTook: BA.isFilled(h.aTook) ? Number(h.aTook) : null,
          bBid: BA.isFilled(h.bBid) ? Number(h.bBid) : null,
          bTook: BA.isFilled(h.bTook) ? Number(h.bTook) : null,
          aBoard: BA.normalizeBoard(h.aBoard),
          bBoard: BA.normalizeBoard(h.bBoard),
          aBoston: !!h.aBoston,
          bBoston: !!h.bBoston,
          aBostonMade: h.aBostonMade === true ? true : (h.aBostonMade === false ? false : null),
          bBostonMade: h.bBostonMade === true ? true : (h.bBostonMade === false ? false : null),
          aRainbow: !!h.aRainbow && !!BA.rainbowFor(list[i]),
          bRainbow: !!h.bRainbow && !!BA.rainbowFor(list[i]),
          recorded: !!h.recorded || (BA.isHandComplete(h) && h.recorded !== false)
        };
      });
    }
    function boot() {
      state.prefs = Object.assign({ tipDismissed: false }, loadJson(KEYS.prefs, {}));
      state.past = loadJson(KEYS.past, []);
      if (!Array.isArray(state.past)) state.past = [];
      var saved = loadJson(KEYS.current, null);
      if (saved && saved.hands) {
        state.game = {
          id: saved.id || uid(),
          startedAt: saved.startedAt || new Date().toISOString(),
          updatedAt: saved.updatedAt || new Date().toISOString(),
          teamA: Object.assign({ name: 'Team A', p1: '', p2: '' }, saved.teamA),
          teamB: Object.assign({ name: 'Team B', p1: '', p2: '' }, saved.teamB),
          firstDealer: typeof saved.firstDealer === 'number' ? saved.firstDealer : 0,
          maxCards: BA.clampMaxCards(saved.maxCards),
          hands: migrateHands(saved.hands, saved.maxCards),
          archived: !!saved.archived
        };
      } else {
        var p = state.prefs;
        state.game = createGame({
          teamA: p.teamA && p.teamA.name, a1: p.teamA && p.teamA.p1, a2: p.teamA && p.teamA.p2,
          teamB: p.teamB && p.teamB.name, b1: p.teamB && p.teamB.p1, b2: p.teamB && p.teamB.p2,
          firstDealer: p.firstDealer,
          maxCards: p.lastMaxCards
        });
      }
      render();
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function () {});
      }
    }

    document.getElementById('app').addEventListener('click', onClick);
    document.getElementById('app').addEventListener('input', onInput);
    boot();
  })();
  </script>
</body>
</html>
